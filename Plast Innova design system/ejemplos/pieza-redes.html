<!-- @dsCard group="Ejemplos" viewport="1080x1080" name="Pieza de redes" subtitle="Post 1080×1080 — marcador de foto, un solo CTA rojo" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;padding:0}.post{width:1080px;height:1080px;background:var(--pi-gradient-blue);position:relative;overflow:hidden;display:flex;flex-direction:column;font-family:var(--font-brand)}</style>
</head><body>
<div class="post">
<div style="position:absolute;right:-160px;top:-160px;width:620px;height:620px;border-radius:50%;background:rgba(255,255,255,.05)"></div>
<div style="position:absolute;left:-120px;bottom:-200px;width:520px;height:520px;border-radius:50%;background:rgba(255,0,0,.10)"></div>

<div style="padding:64px 64px 0;display:flex;align-items:center;justify-content:space-between;position:relative">
<img src="../assets/logo-horizontal-ng.png" alt="Plast Innova" style="height:56px">
<span style="font:var(--type-eyebrow);font-size:16px;letter-spacing:var(--ls-widest);text-transform:uppercase;color:rgba(255,255,255,.7)">Lámparas LED</span>
</div>

<div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 64px;position:relative">
<span style="align-self:flex-start;background:var(--pi-red-600);color:#fff;font:var(--type-eyebrow);font-size:18px;letter-spacing:var(--ls-widest);text-transform:uppercase;padding:12px 24px;border-radius:var(--radius-pill);box-shadow:var(--shadow-accent)">Nueva línea bi-LED</span>
<h1 style="font-family:var(--font-brand);font-size:104px;line-height:1;font-weight:var(--fw-bold);letter-spacing:var(--ls-tighter);color:#fff;margin:32px 0 0">Luz que rinde,<br>lujos que duran</h1>
<p style="font-family:var(--font-brand);font-size:30px;line-height:1.45;color:rgba(255,255,255,.85);max-width:22ch;margin:32px 0 0;text-wrap:pretty">12.000 lúmenes. Instalación el mismo día en Bogotá.</p>
<div style="display:flex;gap:48px;margin-top:56px">
<div><div style="font-family:var(--font-data);font-size:56px;font-weight:var(--fw-bold);color:#fff;line-height:1">6000K</div><div style="font-family:var(--font-brand);font-size:20px;color:rgba(255,255,255,.7);margin-top:6px">luz fría</div></div>
<div style="width:1px;background:rgba(255,255,255,.25)"></div>
<div><div style="font-family:var(--font-data);font-size:56px;font-weight:var(--fw-bold);color:#fff;line-height:1">1 año</div><div style="font-family:var(--font-brand);font-size:20px;color:rgba(255,255,255,.7);margin-top:6px">de garantía</div></div>
</div>
</div>

<div style="margin:0 64px;height:290px;border-radius:var(--radius-xl);background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:rgba(255,255,255,.7)">
<i class="fa-solid fa-image" style="font-size:34px"></i>
<span style="font-family:var(--font-brand);font-size:18px;letter-spacing:var(--ls-wide);text-transform:uppercase">Foto del kit H4 instalado</span>
</div>

<div style="padding:48px 64px 64px;display:flex;align-items:center;justify-content:space-between">
<span style="font-family:var(--font-brand);font-size:24px;font-weight:var(--fw-semibold);letter-spacing:var(--ls-wide);text-transform:uppercase;color:#fff;background:var(--pi-red-600);padding:22px 44px;border-radius:var(--radius-pill);box-shadow:var(--shadow-accent)">Escríbenos al WhatsApp</span>
<div style="text-align:right;font-family:var(--font-brand);font-size:20px;color:rgba(255,255,255,.72);line-height:1.5">plast-innova.com.co<br>Bogotá · envíos a todo el país</div>
</div>
</div></body></html>
