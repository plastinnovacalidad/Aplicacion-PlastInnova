<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Icon, Card, Badge, Tag, Input, Select, Checkbox, Radio, Switch, Tabs, Breadcrumb, Dialog, Toast, Tooltip } = window.PlastInnovaDesignSystem_ff345a;

function Demo(){
  const [envio,setEnvio]=React.useState('local');
  return (
  <div className="stack">
    <div className="row" style={{alignItems:'flex-start',gap:20}}>
      <Input label="Nombre" placeholder="Tu nombre" wrapperStyle={{width:200}}/>
      <Input label="Correo" iconLeft="envelope" placeholder="tu@correo.com" hint="Solo para tu pedido." wrapperStyle={{width:220}}/>
      <Input label="Placa" defaultValue="ABC123" error="Placa no válida" wrapperStyle={{width:170}}/>
    </div>
    <div className="row" style={{alignItems:'flex-start',gap:20}}>
      <Select label="Temperatura" options={['3000K cálida','4300K neutra','6000K fría']} wrapperStyle={{width:200}}/>
      <Select label="Ciudad" options={['Bogotá','Medellín','Cali']} wrapperStyle={{width:180}}/>
      <Input label="Deshabilitado" placeholder="—" disabled wrapperStyle={{width:170}}/>
    </div>
    <div className="row" style={{gap:26}}>
      <Checkbox label="Solo en stock" defaultChecked/>
      <Checkbox label="Envío gratis"/>
      <Checkbox label="Descontinuado" disabled/>
      <Radio name="envio" value="local" checked={envio==='local'} onChange={setEnvio} label="Recoger en tienda"/>
      <Radio name="envio" value="dom" checked={envio==='dom'} onChange={setEnvio} label="Domicilio"/>
      <Switch label="Precios mayoristas" defaultChecked/>
    </div>
  </div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
