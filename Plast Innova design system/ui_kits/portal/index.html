<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Plast Innova — Sistema de Calidad y Control</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-subtle)}#root{min-height:100vh;display:flex;flex-direction:column;position:relative}#root>main{flex:1}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Portal.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel">
function App(){
  const [logged,setLogged]=React.useState(false);
  const [view,setView]=React.useState('portal');
  const go=(v)=>{setView(v);window.scrollTo(0,0);};
  return (
    <React.Fragment>
      <AppHeader user="Julio Ramírez" rol="Coordinador de Calidad" onHome={()=>go('portal')} onLogout={()=>{setLogged(false);go('portal');}}/>
      <main>
        {view==='portal' ? <Portal onOpen={go}/> : <Dashboard onHome={()=>go('portal')}/>}
      </main>
      {!logged && <Login onLogin={()=>setLogged(true)}/>}
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
