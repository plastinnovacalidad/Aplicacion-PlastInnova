<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero de Garantías</title>
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
  <link rel="stylesheet" href="css/comun.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f7; color: #333; min-height: 100vh; display: flex; flex-direction: column; }

    /* Header: estructura viene de css/comun.css; el color/tamaño de esta
       página coincide con los valores por defecto, no hace falta variable. */
    .header-left { display: flex; align-items: center; gap: 15px; }
    .header-left h1 { font-size: 20px; font-weight: 600; }
    .btn-back { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 5px; }
    .btn-back:hover { background: rgba(255,255,255,0.35); }
    /* btn-logout: mismo estilo base de css/comun.css, solo cambia el padding */
    .btn-logout { --btn-logout-padding: 6px 12px; }

    .main-container { padding: 20px 30px; display: flex; flex-direction: column; gap: 20px; flex: 1; max-width: 1600px; width: 100%; margin: 0 auto; }

    /* Julio pidió separar en dos módulos lo que antes eran 2 pestañas acá:
       la parte de "Gestión, Carga y Listado" (el formulario para registrar
       devoluciones/garantías, con sus 2 modales y autocompletados) se
       trasladó por completo al módulo de Calidad (Public/calidad.html,
       pestaña "📋 Cargar Garantías") — así que ya no vive en este archivo.
       Acá solo queda el Tablero Analítico, sin pestañas. */
    .dashboard-iframe-container { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; flex: 1; display: flex; flex-direction: column; min-height: calc(100vh - 140px); }
    .dashboard-iframe-container iframe { width: 100%; height: 100%; border: none; flex: 1; }
  </style>
</head>
<body>

  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <img src="img/logo.png" alt="Plast Innova" class="login-logo">
      <h2>📊 Tablero de Garantías</h2>
      <input type="text" id="loginUser" placeholder="Usuario" autocomplete="username">
      <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password">
      <button onclick="doLogin()">Iniciar Sesión</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <div class="header" id="appHeader" style="display:none;">
    <div class="header-brand">
      <img src="img/logo.png" alt="Plast Innova" class="header-logo">
      <div class="header-left">
        <h1>Tablero de Garantías</h1>
      </div>
    </div>
    <div class="header-right">
      <span id="userNameDisplay">Usuario</span>
      <a href="index.html" class="btn-back" id="btnVolverPortal">&larr; Volver al Portal</a>
      <button class="btn-logout" onclick="doLogout()">Cerrar Sesión</button>
    </div>
  </div>

  <div class="main-container" id="appMain" style="display:none;">
    <div class="dashboard-iframe-container">
      <iframe src="dashboard_garantias.html" id="dashboardIframe"></iframe>
    </div>
  </div>

  <script src="js/comun.js"></script>
  <script>
    let token = localStorage.getItem('token');
    let usuarioActual = '';
    let permisosUsuario = [];

    // La lógica (fetch de /api/roles + /api/me) ahora vive en js/comun.js
    // como cargarPermisosDelUsuario() (era idéntica en garantias.html,
    // index.html y metrologia.html).
    async function cargarMisPermisos() {
      await cargarPermisosDelUsuario();
    }

    async function init() {
      token = localStorage.getItem('token');
      if (!token) { mostrarLogin(); return; }
      const ok = await verificarSesion();
      if (!ok) return;
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('appHeader').style.display = 'flex';
      document.getElementById('appMain').style.display = 'flex';

      // El tablero vive en un iframe aparte (dashboard_garantias.html) que
      // toma el token de localStorage al cargar. Como el iframe puede
      // haber empezado a cargar antes de que termine el login, se le pide
      // que se refresque apenas ya hay sesión válida — si todavía no ha
      // terminado de cargar, se espera a que cargue y ahí se le pide (esto
      // ya se hacía antes al cambiar a la pestaña del tablero; ahora se
      // hace una sola vez porque ya no hay pestañas).
      const iframe = document.getElementById('dashboardIframe');
      if (iframe) {
        if (iframe.contentWindow && typeof iframe.contentWindow.init === 'function') {
          iframe.contentWindow.init();
        } else {
          iframe.addEventListener('load', () => {
            if (iframe.contentWindow && typeof iframe.contentWindow.init === 'function') iframe.contentWindow.init();
          });
        }
      }
    }

    async function doLogout() {
      if (token) {
        await fetch('/api/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
      }
      localStorage.removeItem('token');
      token = null;
      mostrarLogin();
    }

    // mostrarLogin() y doLogin() ahora viven en js/comun.js (eran idénticas
    // carácter por carácter en garantias.html, metrologia.html y whatsapp_bot.html).

    // Devuelve true si la sesión es válida y ya se puede mostrar el módulo;
    // false si se mostró el login o se redirigió (permiso insuficiente).
    async function verificarSesion() {
      try {
        const res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await res.json();
        if (res.ok && data) {
          usuarioActual = data.nombre || data.usuario;
          document.getElementById('userNameDisplay').textContent = `${data.nombre || data.usuario} (${data.rol_nombre || data.rol || 'Usuario'})`;

          await cargarMisPermisos();
          // Este módulo ahora es solo el Tablero Analítico — la parte de
          // cargar/gestionar garantías se movió a Calidad (ver comentario
          // arriba de ".dashboard-iframe-container"). El permiso que manda
          // acá es "garantias.dashboard" (antes era "garantias.ver", que
          // ahora solo aplica a la pestaña de Cargar Garantías en Calidad).
          if (!tienePermiso('garantias.dashboard')) {
            alert('No tienes permiso para ver el Tablero de Garantías.');
            location.href = 'index.html';
            return false;
          }

          const btnVolver = document.getElementById('btnVolverPortal');
          if (btnVolver) {
            btnVolver.style.display = tienePermiso('portal.volver') ? 'inline-flex' : 'none';
          }

          return true;
        } else {
          localStorage.removeItem('token');
          token = null;
          mostrarLogin();
          return false;
        }
      } catch (e) {
        mostrarLogin();
        return false;
      }
    }

    document.getElementById('loginPass').addEventListener('keypress', (e) => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('loginUser').addEventListener('keypress', (e) => { if (e.key === 'Enter') doLogin(); });
    init();
  </script>
</body>
</html>
