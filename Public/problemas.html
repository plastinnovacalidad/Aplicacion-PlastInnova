<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Problemas - Calidad & Circuitos SMD</title>
  <!-- MIGRACIÓN #50 (09/09, pedido por Julio): "vamos a unir los módulos
       problemas con seguimiento de producción... y vamos a llamar el modulo
       'Reportes'" -- este módulo ya no es una página aparte, ahora es la
       pestaña "Reportes Generales" de Public/reportes.html. Este archivo se
       deja como una simple redirección (en vez de borrarlo) para que un
       acceso directo o favorito viejo a esta URL siga funcionando, sin caer
       en un error -- mismo criterio que ya se usó con
       Public/seguimiento_produccion.html cuando ese módulo se unió acá
       (MIGRACIÓN #38 en su momento). ?pestaña= (Problemas vs Seguimiento de
       Producción) sigue funcionando igual, un nivel más adentro. -->
  <script>
    const pestaña = new URLSearchParams(location.search).get('pestaña');
    location.replace('reportes.html?modulo=generales' + (pestaña ? '&pestaña=' + encodeURIComponent(pestaña) : ''));
  </script>
</head>
<body>
  <p style="font-family: sans-serif; color: #718096; padding: 40px; text-align:center;">
    Este módulo ahora vive dentro de <a href="reportes.html?modulo=generales">Reportes</a>, en la pestaña "Reportes Generales".
  </p>
</body>
</html>
